<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Tutorial</title>
    <style>
        .container{
            height:544px;
            width:100%;
            border:2px solid black;
            /* Initialize the container as a flex box  */
            display:flex;

             /* Flex properties for a flex container */

             
             /* flex-direction: row;   (Default value of flex-direction is row)     */
             /* flex-direction: column;
             flex-direction: row-reverse;
             flex-direction: column-reverse; */


             /* flex-wrap: wrap;     (Default value of flex-wrap is no-wrap)  */
             /* flex-wrap: wrap-reverse; */

             /* This is a shorthand for flex-direction; and flex-wrap; */
             /* flex-flow: row-reverse wrap;  */


            /* justify-content will justify the content in horizontal direction */
             /* justify-content: center;
             justify-content: space-between;
             justify-content: space-evenly; */
             /* justify-content: space-around; */


            /* align-items will justify the content in vertical direction */
             /* align-items: center; */
             /* align-items: flex-end; */
             /* align-items: flex-start; */
             /* align-items: stretch; */
             
        }
        .item{
            background-color: tomato;
            border:2px solid rgb(72, 0, 255);
            margin:10px;
            padding:3px;
            width:200px;
            height:200px;
        }

        #item1{
            /* Flex properties for a flex item */
            /* Higher the order,later it shows up in the flex container  */
            /* order: 2; */

            /* flex-grow: 2; /* It will grow and take the available space in the flex container */
            /* flex-shrink: 2;  It will shrink and take the available space in the flex container  */
        }
        #item2{

            /* flex-grow: 3; 
            flex-shrink:3; */
            flex-basis: 150px; /* It will take the available space in the flex container */
            /* when flex-direction is set to row flex-basis: will control width */
            /* when flex-direction is set to column flex-basis: will control height */

        }
        #item3{
            flex: 2 2 250px; 
            /* align-self: flex-end;  It will override the align-items property of the flex container  */
            /* align-self: flex-start; /* It will override the align-items property of the flex container  */
            align-self: center; /* It will override the align-items property of the flex container  */
        }
    </style>
</head>
<body>
    <h1>This is Flexbox Tutorial</h1>
    <div class="container">
        <div class="item" id="item1">First Box</div>
        <div class="item" id="item2">Second Box</div>
        <div class="item" id="item3">Third Box</div>
        <!-- <div class="item" id="item4">Fourth Box</div>
        <div class="item" id="item5">Fifth Box</div>
        <div class="item" id="item6">Sixth Box</div> -->
    </div>
    
</body>
</html>
